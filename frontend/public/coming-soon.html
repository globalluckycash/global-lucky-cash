<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLOBAL LUCKY CASH</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0f1115;
        background-image: radial-gradient(circle at 50% 0%, #051f18 0%, #0f1115 70%);
        font-family: 'Inter', sans-serif;
        color: #fff;
        position: relative;
        overflow: hidden;
        padding: 24px;
      }
      .grid-bg {
        position: absolute;
        inset: 0;
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
      }
      .lang-toggle {
        position: absolute;
        top: 24px;
        right: 24px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: transparent;
        color: #d1d5db;
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .lang-toggle:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 640px;
      }
      .logo-badge {
        width: 80px;
        height: 80px;
        border-radius: 999px;
        background: rgba(10, 193, 142, 0.2);
        border: 1px solid rgba(10, 193, 142, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        box-shadow: 0 0 10px rgba(10, 193, 142, 0.4), 0 0 20px rgba(10, 193, 142, 0.2);
        animation: glow-pulse 1.8s ease-in-out infinite;
      }
      @keyframes glow-pulse {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(0, 255, 194, 0.5), 0 0 20px rgba(0, 255, 194, 0.25);
        }
        50% {
          box-shadow: 0 0 20px rgba(0, 255, 194, 0.9), 0 0 40px rgba(0, 255, 194, 0.5);
        }
      }
      .logo-badge img {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        object-fit: cover;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      h1 span {
        color: #0ac18e;
      }
      .title {
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 24px;
      }
      .message {
        color: #9ca3af;
        font-size: 15px;
        line-height: 1.7;
        margin: 0 0 40px;
      }
      .socials {
        display: flex;
        gap: 24px;
        color: #6b7280;
        font-size: 20px;
      }
      .footer {
        position: absolute;
        bottom: 24px;
        font-size: 11px;
        color: #4b5563;
        font-family: 'Space Mono', monospace;
      }
      [data-lang='en'] {
        display: none;
      }
      html.lang-en [data-lang='zh'] {
        display: none;
      }
      html.lang-en [data-lang='en'] {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="grid-bg"></div>

    <button class="lang-toggle" onclick="toggleLang()">
      <i class="fa-solid fa-globe"></i>
      <span id="lang-label">EN</span>
    </button>

    <div class="content">
      <div class="logo-badge"><img src="/logo.png" alt="Global Lucky Cash" /></div>

      <h1>GLOBAL <span>LUCKY CASH</span></h1>

      <p class="title" data-lang="zh">即將推出</p>
      <p class="title" data-lang="en">Coming Soon</p>

      <p class="message" data-lang="zh">我們正在打造史上最公平、最透明的區塊鏈彩票平台,敬請期待正式上線。</p>
      <p class="message" data-lang="en">
        We're building the fairest, most transparent blockchain lottery platform. Stay tuned for launch.
      </p>

      <div class="socials">
        <i class="fa-brands fa-x-twitter"></i>
        <i class="fa-brands fa-telegram"></i>
        <i class="fa-brands fa-discord"></i>
      </div>
    </div>

    <div class="footer">© 2026 GLOBAL LUCKY CASH. POWERED BY BITCOIN CASH SMART CONTRACTS.</div>

    <script>
      function toggleLang() {
        const isEn = document.documentElement.classList.toggle('lang-en')
        document.getElementById('lang-label').textContent = isEn ? '繁中' : 'EN'
      }
    </script>
  </body>
</html>
